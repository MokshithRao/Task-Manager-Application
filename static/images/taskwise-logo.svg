<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" role="img" aria-labelledby="title desc">
  <title id="title">Taskwise logo</title>
  <desc id="desc">A forest-green rounded checklist icon beside the Taskwise wordmark.</desc>

  <!-- Icon background -->
  <rect x="12" y="18" width="144" height="144" rx="34" fill="#F7F5F0"/>

  <!-- Checklist card -->
  <rect x="43" y="42" width="82" height="96" rx="13" fill="#315C4C"/>

  <!-- Checklist rows -->
  <rect x="57" y="60" width="13" height="13" rx="3" fill="#E0E9E2"/>
  <path d="M59.5 66.5l3.5 3.5 6.5-8" fill="none" stroke="#315C4C" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M78 66.5h33" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>

  <rect x="57" y="86" width="13" height="13" rx="3" fill="#E0E9E2"/>
  <path d="M59.5 92.5l3.5 3.5 6.5-8" fill="none" stroke="#315C4C" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M78 92.5h25" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>

  <rect x="57" y="112" width="13" height="13" rx="3" fill="#E0E9E2"/>
  <path d="M78 118.5h29" stroke="#A8B9A0" stroke-width="5" stroke-linecap="round"/>

  <!-- Small completion accent -->
  <circle cx="137" cy="39" r="16" fill="#A8B9A0"/>
  <path d="M130 39l5 5 9-11" fill="none" stroke="#315C4C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="184" y="91" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" letter-spacing="-1.5">Taskwise</text>
  <text x="187" y="122" fill="#E0E9E2" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" letter-spacing="3">PLAN  •  TRACK  •  COMPLETE</text>
</svg>
